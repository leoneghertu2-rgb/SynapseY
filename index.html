<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synapse Key</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Star field */
  canvas#stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  /* Subtle radial glow in center */
  .glow-bg {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 700px; height: 350px;
    background: radial-gradient(ellipse, rgba(0,255,100,0.045) 0%, transparent 70%);
    z-index: 1;
    pointer-events: none;
  }

  /* Top label */
  .top-label {
    position: fixed;
    top: 36px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 0;
    letter-spacing: 0.18em;
    font-size: 1.05rem;
    user-select: none;
  }

  .top-label .synapse { color: #ffffff; }
  .top-label .y      { color: #00ff66; }
  .top-label .key    { color: #ffffff; }

  /* Scanline overlay */
  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.13) 3px,
      rgba(0,0,0,0.13) 4px
    );
    z-index: 2;
    pointer-events: none;
  }

  /* Center key */
  .center {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .key-text {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: clamp(2.4rem, 6vw, 4.8rem);
    letter-spacing: 0.12em;
    background: linear-gradient(
      90deg,
      #ffffff 0%,
      #aaffcc 20%,
      #00ff66 40%,
      #ffffff 60%,
      #00ff66 80%,
      #aaffcc 100%
    );
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3.2s linear infinite;
    filter: drop-shadow(0 0 18px rgba(0,255,100,0.55)) drop-shadow(0 0 40px rgba(0,255,100,0.2));
    white-space: nowrap;
  }

  @keyframes shimmer {
    0%   { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }

  /* Decorative line under key */
  .key-underline {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #00ff66 40%, #ffffff 50%, #00ff66 60%, transparent);
    animation: pulse-line 2.4s ease-in-out infinite;
    opacity: 0.7;
  }

  @keyframes pulse-line {
    0%, 100% { opacity: 0.4; transform: scaleX(0.85); }
    50%       { opacity: 0.9; transform: scaleX(1); }
  }

  /* Corner decorations */
  .corner {
    position: fixed;
    width: 44px; height: 44px;
    z-index: 10;
    opacity: 0.45;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: #00ff66;
  }
  .corner::before { width: 100%; height: 1.5px; top: 0; left: 0; }
  .corner::after  { width: 1.5px; height: 100%; top: 0; left: 0; }

  .corner.tl { top: 20px; left: 20px; }
  .corner.tr { top: 20px; right: 20px; transform: scaleX(-1); }
  .corner.bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
  .corner.br { bottom: 20px; right: 20px; transform: scale(-1); }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="glow-bg"></div>
<div class="scanlines"></div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="top-label">
  <span class="synapse">Synapse</span><span class="y">Y</span><span class="key">Key</span>
</div>

<div class="center">
  <div class="key-text">Q7XM-P4KD-9LNW-T2RG-H8CV</div>
  <div class="key-underline"></div>
</div>

<script>
  // Star field
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const STAR_COUNT = 220;
  const stars = Array.from({ length: STAR_COUNT }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 1.4 + 0.2,
    speed: Math.random() * 0.00008 + 0.00002,
    alpha: Math.random() * 0.7 + 0.2,
    twinkleOffset: Math.random() * Math.PI * 2
  }));

  let t = 0;
  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    t += 0.016;
    for (const s of stars) {
      const twinkle = 0.5 + 0.5 * Math.sin(t * 1.1 + s.twinkleOffset);
      ctx.globalAlpha = s.alpha * (0.5 + 0.5 * twinkle);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(drawStars);
  }
  drawStars();
</script>
</body>
</html>
